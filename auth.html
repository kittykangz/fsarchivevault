<script>  
let favArrayFull = [];
document.addEventListener('wheel', (e) => {
	const modal = document.querySelector('.auth-modal:not(.hidden)');
	if (!modal) return;
	const scroller = e.target.closest('.fav-grid-wrap');
	if (scroller) {
		const atTop = scroller.scrollTop === 0;
		const atBottom = scroller.scrollTop + scroller.clientHeight >= scroller.scrollHeight;
		const scrollingUp = e.deltaY < 0;
		const scrollingDown = e.deltaY > 0;
		if ((scrollingUp && atTop) || (scrollingDown && atBottom)) {
			e.preventDefault();
		}
		return;
	}
	e.preventDefault();
}, {
	passive: false
});
let touchStartY = 0;
document.addEventListener('touchstart', (e) => {
	touchStartY = e.touches[0].clientY;
}, {
	passive: true
});
document.addEventListener('touchmove', (e) => {
	const modal = document.querySelector('.auth-modal:not(.hidden)');
	if (!modal) return;
	const scroller = e.target.closest('.fav-grid-wrap');
	if (scroller) {
		const deltaY = touchStartY - e.touches[0].clientY;
		const atTop = scroller.scrollTop === 0;
		const atBottom = scroller.scrollTop + scroller.clientHeight >= scroller.scrollHeight;
		const scrollingUp = deltaY < 0;
		const scrollingDown = deltaY > 0;
		if ((scrollingUp && atTop) || (scrollingDown && atBottom)) {
			e.preventDefault();
		}
		return;
	}
	e.preventDefault();
}, {
	passive: false
});

function parseRel(rel) {
	const parts = rel.split("/");
	return {
		group: parts[0] || "",
		member: parts[1] || ""
	};
}

function buildFavArray() {
	return [...window.userFavorites].map(key => {
		const [bit, rel] = key.split("|");
		const parts = rel.split("/");
		return {
			bit,
			rel_path: rel,
			group: parts[0],
			member: parts[1]
		};
	});
}

function populateFavFilters(favArray) {
	const groupSelect = document.getElementById("fav-filter-group");
	const memberSelect = document.getElementById("fav-filter-member");
	groupSelect.innerHTML = '<option value="">all</option>';
	memberSelect.innerHTML = '<option value="">all</option>';
	const groups = new Set();
	const members = new Set();
	favArray.forEach(fav => {
		groups.add(fav.group);
		members.add(fav.member);
	});
	[...groups].sort().forEach(g => {
		const opt = document.createElement("option");
		opt.value = g;
		opt.textContent = g;
		groupSelect.appendChild(opt);
	});
	[...members].sort().forEach(m => {
		const opt = document.createElement("option");
		opt.value = m;
		opt.textContent = m;
		memberSelect.appendChild(opt);
	});
}

function populateFavGrid() {
	const grid = document.getElementById("fav-grid");
	grid.innerHTML = "";
	const favArray = [...window.userFavorites].map(key => {
		const [bit, rel] = key.split("|");
		return {
			bit,
			rel_path: rel
		};
	});
	favArray.forEach(fav => {
		const rel = fav.rel_path;
		const parts = rel.split("/");
		const filename = parts.pop();
		const dir = parts.join("/");
		const thumbUrl = `https://terril.duckdns.org/${dir}/thumbs/${filename}`;
		const div = document.createElement("div");
		div.className = "grid-thumb";
		div.style.backgroundImage = `url('${thumbUrl}')`;
		div.onclick = (e) => {
			e.preventDefault();
			e.stopPropagation();
			openFavContextMenu(e, fav);
		};
		const info = window.userFavoritesData[fav.bit];
		if (info && info.assigned_date) {
			const label = document.createElement("div");
			label.className = "fav-date-label";
			label.textContent = info.assigned_date;
			div.appendChild(label);
		}
		const gmLabel = document.createElement("div");
		const decodedDir = decodeURIComponent(dir);
		gmLabel.className = "fav-gm-label";
		gmLabel.textContent = decodedDir;
		div.appendChild(gmLabel);
		grid.appendChild(div);
	});
	document.getElementById("fav-footer-count").textContent =
		`${favArray.length} favorites`;
}

function applyFavFilters() {
	const group = document.getElementById("fav-filter-group").value;
	const member = document.getElementById("fav-filter-member").value;
	let filtered = favArrayFull;
	if (group) {
		filtered = filtered.filter(f => f.group === group);
	}
	if (member) {
		filtered = filtered.filter(f => f.member === member);
	}
	renderFilteredGrid(filtered);
}

function rebuildMemberOptionsForGroup(group) {
	const memberSelect = document.getElementById("fav-filter-member");
	let source = favArrayFull;
	if (group) {

function favStripLoop(now) {
	const dt = now - favStripLast;
	favStripLast = now;
	if (!favStripPaused) {
		favStripCurrentSpeed += (favStripSpeed - favStripCurrentSpeed) * 0.02;
		favStripX -= (favStripCurrentSpeed * dt) / 1000;
		const strip = document.getElementById("fav-strip");
		if (strip) {
			const first = strip.children[0];
			if (first) {
				const firstWidth = first.offsetWidth + 4;
				if (Math.abs(favStripX) >= firstWidth) {
					strip.appendChild(first);
					favStripX += firstWidth;
				}
				strip.style.transform = `translateX(${favStripX}px)`;
			}
		}
	}
	requestAnimationFrame(favStripLoop);
}

async function downloadImage(fullUrl, filename) {
	try {
		const res = await fetch(fullUrl, {
			mode: "cors"
		});
		const blob = await res.blob();
		const url = URL.createObjectURL(blob);
		const a = document.createElement("a");
		a.href = url;
		a.download = filename;
		document.body.appendChild(a);
		a.click();
		a.remove();
		URL.revokeObjectURL(url);
	} catch (err) {
		console.error("Download failed:", err);
		window.open(fullUrl, "_blank");
	}
}

function formatAgeOD(ms) {
	let remaining = ms;
	const y = Math.floor(remaining / (365 * 24 * 60 * 60 * 1000));
	remaining %= 365 * 24 * 60 * 60 * 1000;
	const m = Math.floor(remaining / (30 * 24 * 60 * 60 * 1000));
	remaining %= 30 * 24 * 60 * 60 * 1000;
	const d = Math.floor(remaining / (24 * 60 * 60 * 1000));
	remaining %= 24 * 60 * 60 * 1000;
	const h = Math.floor(remaining / (60 * 60 * 1000));
	remaining %= 60 * 60 * 1000;
	const min = Math.floor(remaining / (60 * 1000));
	remaining %= 60 * 1000;
	const s = Math.floor(remaining / 1000);
	const ms2 = Math.floor(remaining % 1000);
	const parts = [];
	if (y > 0) parts.push(`${y}y`);
	if (m > 0) parts.push(`${m}m`);
	if (d > 0) parts.push(`${String(d).padStart(2, "0")}d`);
	parts.push(String(h).padStart(2, "0"));
	parts.push(String(min).padStart(2, "0"));
	parts.push(String(s).padStart(2, "0"));
	parts.push(String(ms2).padStart(3, "0"));
	while (parts.length > 1 && (parts[0] === "00" || parts[0] === "000")) {
		parts.shift();
	}
	return parts.join(":");
}
let ageInterval = null;
async function checkLogin() {
	const {
		status,
		data
	} = await api("me");
	const entry = document.getElementById("auth-entry");
	if (!entry) return;
	const initialEl = document.getElementById("profile-avatar-initial");
	if (initialEl && data.user && data.user.username) {
		initialEl.textContent = data.user.username[0].toUpperCase();
	}
	const createdEl = document.getElementById("profile-created");
	if (createdEl && data.user && data.user.created_at) {
		const d = new Date(data.user.created_at * 1000);
		const yy = String(d.getFullYear()).slice(2);
		const mm = String(d.getMonth() + 1).padStart(2, "0");
		const dd = String(d.getDate()).padStart(2, "0");
		createdEl.textContent = `created_at → ${yy}${mm}${dd}`;
	}
	const ageValue = document.getElementById("age-value");
	if (ageValue && data.user && data.user.created_at) {
		const createdMs = data.user.created_at * 1000;
		if (ageInterval !== null) {
			clearInterval(ageInterval);
			ageInterval = null;
		}

		function updateAge() {
			const now = Date.now();
			const diff = now - createdMs;
			ageValue.textContent = formatAgeOD(diff);
		}
		updateAge();
		ageInterval = setInterval(updateAge, 50);
	}
	if (!data || !data.user) {
		isLoggedIn = false;
		entry.textContent = "Login";
		entry.onclick = () => openLoginModal();
		return;
	}
	isLoggedIn = true;
	entry.textContent = data.user.username;
	closeAllModals();
	entry.onclick = () => {
		closeAllModals();
		document.getElementById("profile-username").textContent = data.user.username;
		document.getElementById("profile-modal").classList.remove("hidden");

		loadRank();
		populateFavoriteStrip();
		startFavStripScroll();
	};
}
async function doLogin() {
	clearAuthError("login");
	const username = document.getElementById("login-username").value.trim();
	const password = document.getElementById("login-password").value.trim();
	if (!username || !password) {
		showAuthError("login", "Please enter both username and password.");
		return;
	}
	const {
		status,
		data
	} = await api("login", "POST", {
		username,
		password
	});
	if (status === 429) {
		showAuthError("login", "Too many attempts. Please wait a moment.");
		return;
	}
	if (status >= 500) {
		showAuthError("login", "Server error. Please try again later.");
		return;
	}
	if (data && data.token) {
		showAuthSuccess("login", "Logged in successfully!");
		setTimeout(() => {
			localStorage.setItem("token", data.token);
			closeAllModals();
			checkLogin();
		}, 800);
		return;
	}
	if (data && data.error === "missing_credentials") {
		showAuthError("login", "Please enter both fields.");
	} else if (data && data.error === "invalid_credentials") {
		showAuthError("login", "Incorrect username or password.");
	} else {
		showAuthError("login", "Login failed. Try again.");
	}
}

function setupViewTracking() {
	const observer = new IntersectionObserver((entries) => {
		for (const entry of entries) {
			if (!entry.isIntersecting) continue;
			const bitIndex = parseInt(entry.target.dataset.bitIndex, 10);
			// entry.target.classList.add("seen-debug");
			markViewed(bitIndex);
		}
	}, {
		root: document.querySelector(".all"),
		threshold: 0.5
	});
	return observer;
}
let viewedQueue = new Set();
let viewedTimer = null;
let viewedSet = new Set();
async function markViewed(bitIndex) {
	if (!isLoggedIn) return;
	if (viewedSet.has(bitIndex)) return;
	viewedSet.add(bitIndex);
	viewedQueue.add(bitIndex);
	if (!viewedTimer) {
		viewedTimer = setTimeout(async () => {
			const batch = Array.from(viewedQueue);
			viewedQueue.clear();
			viewedTimer = null;
			try {
				await api("viewed", "POST", {
					bit_indices: batch
				}); // single request
			} catch (e) {
				console.warn("markViewed failed", e);
			}
		}, 250);
	}
}
async function loadProgress() {
	const el = document.getElementById("profile-progress");
	el.textContent = "Loading…";
	try {
		const {
			status,
			data
		} = await api("progress", "GET");
		if (status === 401 || !data || data.error === "not_logged_in") {
			console.log("[loadProgress] not logged in");
			el.textContent = "Not logged in";
			return;
		}
		const {
			viewed,
			total,
			bitset
		} = data;
		viewedSet = new Set();
		if (bitset) {
			const bytes = Uint8Array.from(atob(bitset), c => c.charCodeAt(0));
			for (let i = 0; i < bytes.length; i++) {
				const byte = bytes[i];
				if (byte === 0) continue;
				for (let b = 0; b < 8; b++) {
					if (byte & (1 << b)) {
						viewedSet.add(i * 8 + b);
					}
				}
			}
		}
		const pct = total > 0 ? ((viewed / total) * 100).toFixed(1) : "0.0";
		el.innerHTML = `
      <span class="progress-text">${viewed.toLocaleString()} / ${total.toLocaleString()} (${pct}%)</span>
      <div class="progress-track">
        <div class="progress-fill" style="width: ${pct}%"></div>
      </div>
    `;
	} catch (err) {
		console.error("[loadProgress] error", err);
		el.textContent = "Error loading progress";
	}
}
