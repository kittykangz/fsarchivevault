<style>

.topbar-left {
  display: flex;
  align-items: center;
  gap: 12px;
}

#age-cursor {

}

.topbar-right {
  display: flex;
  align-items: center;
  gap: 6px;
}


.topbar-donate {

  align-items: center;

  appearance: none;
  -webkit-appearance: none;
  margin: 0;
  cursor: pointer;

}

/* gold is too pale on the light topbar; same darker gold the sidebar uses */
html:not(.dark) .topbar-donate {
  color: var(--gold-deep);
}

.topbar-donate .ti {
  font-size: 13px;
  line-height: 1;
  transition: transform 0.15s ease;
}

.topbar-donate:hover {
  background: rgba(var(--gold-rgb), 0.18);
}

.topbar-donate:hover .ti {
  transform: scale(1.18);
}

.topbar-donate:focus-visible {
  outline: 1px solid var(--gold-border);
  outline-offset: 1px;
}
  .topbar-auth {
  font-family: 'DM Sans', sans-serif;
  font-size: 10px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  display: flex;
  align-items: center;
  gap: 6px;
  color: var(--text-secondary);
  cursor: pointer;
  padding: 5px 10px;
  border: 0.5px solid var(--border-strong);
  border-radius: 2px;
  transition: color 0.15s, border-color 0.15s;
}

.topbar-auth .ti { font-size: 13px; line-height: 1; }
.topbar-lang-toggle .ti { font-size: 14px; line-height: 1; }

.topbar-auth:hover {
  color: var(--gold);
  border-color: var(--gold-border);
}

.topbar-sfx-toggle {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 26px;
  height: 23px;
  font-size: 14px;
  color: var(--text-secondary);
  cursor: pointer;
  border: 0.5px solid var(--border-strong);
  border-radius: 2px;
  transition: color 0.15s, border-color 0.15s;
}

.topbar-sfx-toggle:hover {
  color: var(--gold);
  border-color: var(--gold-border);
}

.topbar-sfx-toggle.muted {
  color: var(--error);
}

#server-status {
    display: flex;
    align-items: center;
    gap: 6px;
    font-family: "DM Mono", monospace;
    font-size: 11px;
    color: var(--text-muted);
    position: relative;
    line-height: 1;
}

#status-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--text-muted);
    flex-shrink: 0;
}

#status-dot.online {
    background: #4caf82;
    box-shadow: 0 0 6px #4caf8288;
    animation: pulse-green 2s ease-in-out infinite;
}

#status-dot.offline {
    background: #c0392b;
    box-shadow: 0 0 6px #c0392b88;
    animation: pulse-red 1s ease-in-out infinite;
}

@keyframes pulse-green {
    0%, 100% { opacity: 1; }
    50%       { opacity: 0.4; }
}

@keyframes pulse-red {
    0%, 100% { opacity: 1; }
    50%       { opacity: 0.3; }
}

#status-text {
    color: var(--text-muted);
    letter-spacing: 0.03em;
}

#status-text.online  { color: #4caf82; }
#status-text.offline { color: #c0392b; }

#status-uptime {
    color: var(--text-muted);
    letter-spacing: 0.03em;
}

#status-uptime-wrap {
    display: inline-flex;
    align-items: center;
    min-width: 120px;
    line-height: 1;
}
#status-db-icon {
    font-size: 14px;
    color: var(--text-muted);
}
#status-images,
#status-requests,
#status-latency,
#status-memory {
    color: var(--text-muted);
    letter-spacing: 0.03em;
}
#status-images-wrap,
#status-requests-wrap,
#status-latency-wrap,
#status-memory-wrap {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    margin-left: 6px;
}
#status-clock-icon {
    font-size: 13px;
    color: var(--text-muted);
    opacity: 0.9;
    margin-right: 4px;
}
#status-images-icon,
#status-requests-icon,
#status-latency-icon,
#status-memory-icon {
    font-size: 13px;
    color: var(--text-muted);
    opacity: 0.9;
}

/* single characters of the status text glitch through these looks (the header's looks, but in the text's own muted
   colour instead of gold; text-fill-color keeps currentColor usable for the outline / block) */
.st-ch.lk-off     { opacity: 0; }
.st-ch.lk-ghost   { opacity: 0.2; }
.st-ch.lk-dim     { opacity: 0.55; }
.st-ch.lk-bright  { opacity: 1; text-shadow: 0 0 5px color-mix(in srgb, currentColor 100%, transparent); color: var(--text-secondary) }
.st-ch.lk-outline { -webkit-text-fill-color: transparent; -webkit-text-stroke: 0.6px currentColor; opacity: 0.9; }
.st-ch.lk-block   { background: currentColor; -webkit-text-fill-color: var(--bg); opacity: 0.85; }

/* ---------- language toggle ---------- */
.topbar-lang-toggle {
  display: flex;
  align-items: center;
  justify-content: center;
  min-width: 26px;
  height: 23px;
  padding: 0 6px;
  box-sizing: border-box;
  font-family: 'DM Mono', monospace;
  font-size: 10px;
  letter-spacing: 0.04em;
  color: var(--text-secondary);
  background: transparent;
  cursor: pointer;
  border: 0.5px solid var(--border-strong);
  border-radius: 2px;
  transition: color 0.15s, border-color 0.15s;
}

.topbar-lang-toggle:hover {
  color: var(--gold);
  border-color: var(--gold-border);
}

.topbar-lang-toggle.on {
  color: var(--gold);
  border-color: var(--gold-border);
}

/* English shows Tabler's "abc"; Tabler has no Hangul glyph, so Korean shows 한 sized to match */
.topbar-lang-toggle .ti-abc { font-size: 17px; }

.lang-ico--ko {
  display: none;
  font-family: 'DM Sans', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
  font-size: 13px;
  font-weight: 500;
  line-height: 1;
}

.topbar-lang-toggle.on .lang-ico--en { display: none; }
.topbar-lang-toggle.on .lang-ico--ko { display: block; }

/* ---------- accent picker ---------- */
.accent-wrap {
  position: relative;
  display: flex;
  align-items: center;
}

.topbar-accent-toggle {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 26px;
  height: 23px;
  padding: 0;
  font-size: 14px;
  color: var(--text-secondary);
  background: transparent;
  cursor: pointer;
  border: 0.5px solid var(--border-strong);
  border-radius: 2px;
  transition: color 0.15s, border-color 0.15s;
}

.topbar-accent-toggle:hover,
.topbar-accent-toggle[aria-expanded="true"] {
  color: var(--gold);
  border-color: var(--gold-border);
}

.accent-panel {
  /* absolute (not fixed): .topbar has backdrop-filter, which would re-anchor fixed children */
  position: absolute;
  top: calc(100% + 12px);
  right: 0;
  width: 272px;
  max-width: calc(100vw - 24px);
  box-sizing: border-box;
  padding: 14px;
  display: flex;
  flex-direction: column;
  gap: 12px;
  background: var(--bg-surface);
  border: 0.5px solid var(--border-strong);
  border-radius: 2px;
  box-shadow: 0 6px 18px rgba(0, 0, 0, 0.22);
  font-family: 'DM Sans', sans-serif;
  z-index: 100;
  opacity: 0;
  visibility: hidden;
  transform: translateY(-4px);
  pointer-events: none;
  transition: opacity 0.14s ease, transform 0.14s ease, visibility 0s linear 0.14s;
}

.accent-panel.open {
  opacity: 1;
  visibility: visible;
  transform: none;
  pointer-events: auto;
  transition: opacity 0.14s ease, transform 0.14s ease, visibility 0s;
}

.accent-panel-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.accent-panel-title {
  font-size: 10px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--gold);
}

.accent-preview {
  width: 34px;
  height: 10px;
  border-radius: 2px;
  background: var(--gold);
  border: 0.5px solid var(--gold-border);
}

.accent-presets {
  display: grid;
  /* default swatch | divider | 7 saveable slots */
  grid-template-columns: 1fr 1px repeat(7, 1fr);
  align-items: center;
  gap: 6px;
}

.accent-divider {
  width: 1px;
  height: 16px;
  justify-self: center;
  background: var(--border-strong);
  pointer-events: none;
}

.accent-swatch {
  aspect-ratio: 1;
  padding: 0;
  border-radius: 2px;
  border: 0.5px solid var(--border-strong);
  cursor: pointer;
  transition: border-color 0.15s ease, box-shadow 0.15s ease;
  /* long-press restores a preset, so stop the browser from selecting / showing its own menu */
  -webkit-touch-callout: none;
  -webkit-user-select: none;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}

.accent-swatch:hover { border-color: var(--text-secondary); }

.accent-swatch.active {
  box-shadow: 0 0 0 1.5px var(--bg-surface), 0 0 0 2.5px var(--text-primary);
}

.accent-row { display: flex; flex-direction: column; gap: 6px; }

.accent-label {
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 9px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--text-secondary);
}

/* value readout: a real text field so it can be selected, copied, pasted into or typed in */
.accent-readout {
  width: 52px;
  box-sizing: border-box;
  margin: 0;
  padding: 1px 4px;
  font-family: 'DM Mono', monospace;
  font-size: 9px;
  letter-spacing: 0.03em;
  text-align: right;
  color: var(--text-secondary);
  background: transparent;
  border: 0.5px solid transparent;
  border-radius: 2px;
  outline: none;
  cursor: text;
  user-select: text;
  -webkit-user-select: text;
  transition: color 0.15s, border-color 0.15s, background 0.15s;
}

.accent-readout:hover { border-color: var(--border-strong); }

.accent-readout:focus {
  color: var(--text-primary);
  border-color: var(--gold-border);
  background: var(--gold-bg);
}

.accent-readout::selection { background: var(--gold-border); }

.accent-slider {
  -webkit-appearance: none;
  appearance: none;
  width: 100%;
  height: 10px;
  margin: 0;
  border-radius: 2px;
  border: 0.5px solid var(--border-strong);
  outline: none;
  cursor: pointer;
}

.accent-slider:focus-visible { box-shadow: 0 0 0 1.5px var(--gold-border); }

/* block thumb, like the cursor in the sidebar's pwd bar */
.accent-slider::-webkit-slider-thumb {
  -webkit-appearance: none;
  box-sizing: border-box;
  width: 8px;
  height: 14px;
  border-radius: 1px;
  background: var(--bg);
  border: 1.5px solid var(--text-primary);
}

.accent-slider::-moz-range-thumb {
  box-sizing: border-box;
  width: 8px;
  height: 14px;
  border-radius: 1px;
  background: var(--bg);
  border: 1.5px solid var(--text-primary);
}

/* track gradients follow the other two sliders, so you see the result before you drag */
.accent-slider.hue {
  background: linear-gradient(to right,
    hsl(0 var(--ac-s) var(--ac-l)), hsl(40 var(--ac-s) var(--ac-l)), hsl(80 var(--ac-s) var(--ac-l)),
    hsl(120 var(--ac-s) var(--ac-l)), hsl(160 var(--ac-s) var(--ac-l)), hsl(200 var(--ac-s) var(--ac-l)),
    hsl(240 var(--ac-s) var(--ac-l)), hsl(280 var(--ac-s) var(--ac-l)), hsl(320 var(--ac-s) var(--ac-l)),
    hsl(360 var(--ac-s) var(--ac-l)));
}
.accent-slider.sat {
  background: linear-gradient(to right, hsl(var(--ac-h) 0% var(--ac-l)), hsl(var(--ac-h) 100% var(--ac-l)));
}
.accent-slider.lit {
  background: linear-gradient(to right, hsl(var(--ac-h) var(--ac-s) 48%), hsl(var(--ac-h) var(--ac-s) 78%));
}

.accent-actions { display: flex; gap: 6px; }

.accent-btn {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 5px;
  min-width: 0;
  padding: 6px 4px;
  font-family: 'DM Sans', sans-serif;
  font-size: 10px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--text-secondary);
  background: transparent;
  border: 0.5px solid var(--border-strong);
  border-radius: 2px;
  cursor: pointer;
  transition: color 0.15s, border-color 0.15s;
}

.accent-btn:hover:not(:disabled) { color: var(--gold); border-color: var(--gold-border); }
.accent-btn:disabled { opacity: 0.4; cursor: default; }

/* ---------- topbar button: lit while the accent differs from the default ---------- */
.topbar-accent-toggle.modified {
  color: var(--gold);
  border-color: var(--gold-border);
  background: var(--gold-bg);
}

/* ---------- saveable preset slots ---------- */
.accent-swatch { position: relative; }

/* tiny dot marks a slot that holds one of your own presets */
.accent-swatch.custom::after {
  content: '';
  position: absolute;
  left: 50%;
  top: 50%;
  width: 4px;
  height: 4px;
  margin: -2px 0 0 -2px;
  border-radius: 0;
  background: var(--bg-surface);
  opacity: 0.85;
  pointer-events: none;
}

.accent-hint {
  margin-top: -4px;
  font-size: 9px;
  letter-spacing: 0.08em;
  color: var(--text-secondary);
}

.accent-presets.saving .accent-swatch:not(.stock) {
  outline: 1px dashed var(--text-secondary);
  outline-offset: 2px;
  animation: accent-slot-pulse 1.1s ease-in-out infinite;
}

.accent-presets.saving .accent-swatch.stock {
  opacity: 0.3;
  pointer-events: none;
}

@keyframes accent-slot-pulse {
  0%, 100% { outline-color: var(--text-muted); }
  50%      { outline-color: var(--gold); }
}

.accent-btn.on { color: var(--gold); border-color: var(--gold-border); background: var(--gold-bg); }
.accent-btn .lbl-cancel,
.accent-btn.on .lbl-save { display: none; }
.accent-btn.on .lbl-cancel { display: inline; }
</style>

(function () {

    const dot        = document.getElementById('status-dot');
    const text       = document.getElementById('status-text');
    const uptimeEl   = document.getElementById('status-uptime');
    const requestsEl = document.getElementById('status-requests');
    const latencyEl  = document.getElementById('status-latency');
    const memoryEl   = document.getElementById('status-memory');
    const cursor     = document.getElementById('age-cursor');
    const imagesEl = document.getElementById('status-images');

    let serverUptimeMs = null;
    let fetchedAt      = null;
    let tickTimer      = null;

    function formatUptime(ms) {

        let remaining = ms;

        const y = Math.floor(
            remaining / (365 * 24 * 60 * 60 * 1000)
        );

        remaining %= (
            365 * 24 * 60 * 60 * 1000
        );

        const mo = Math.floor(
            remaining / (30 * 24 * 60 * 60 * 1000)
        );

        remaining %= (
            30 * 24 * 60 * 60 * 1000
        );

        const d = Math.floor(
            remaining / (24 * 60 * 60 * 1000)
        );

        remaining %= (
            24 * 60 * 60 * 1000
        );

        const h = Math.floor(
            remaining / (60 * 60 * 1000)
        );

        remaining %= (
            60 * 60 * 1000
        );

        const min = Math.floor(
            remaining / (60 * 1000)
        );

        remaining %= (
            60 * 1000
        );

        const s = Math.floor(
            remaining / 1000
        );

        const ms2 = Math.floor(
            remaining % 1000
        );

        const parts = [];

        if (y > 0) {
            parts.push(`${y}y`);
        }

        if (mo > 0) {
            parts.push(`${mo}m`);
        }

        if (d > 0) {
            parts.push(
                `${String(d).padStart(2, '0')}d`
            );
        }

        parts.push(
            String(h).padStart(2, '0')
        );

        parts.push(
            String(min).padStart(2, '0')
        );

        parts.push(
            String(s).padStart(2, '0')
        );

        parts.push(
            String(ms2).padStart(3, '0')
        );

        while (
            parts.length > 1 &&
            (
                parts[0] === '00' ||
                parts[0] === '000'
            )
        ) {
            parts.shift();
        }

        return parts.join(':');
    }

    function tick() {

        if (serverUptimeMs === null) {
            return;
        }

        const elapsed =
            performance.now() - fetchedAt;

        uptimeEl.textContent =
            formatUptime(serverUptimeMs + elapsed);
    }

    function setOnline(data) {

        serverUptimeMs = data.uptime * 1000;
        fetchedAt = performance.now();

        dot.className = 'online';

        text.className = 'online';
        text.textContent = 'Online';

        cursor.style.display = 'inline-block';

        requestsEl.textContent =
            `API→${data.requests.toLocaleString()}`;

        latencyEl.textContent =
            `${data.avg_latency_ms}ms`;

        memoryEl.textContent =
            `${data.memory_mb}MB`;

        if (data.avg_latency_ms < 350) {
            latencyEl.style.color = '#4caf82';
        }
        else if (data.avg_latency_ms < 700) {
            latencyEl.style.color = '#d8b15a';
        }
        else {
            latencyEl.style.color = '#c0392b';
        }
        if (imagesEl && data.image_requests !== undefined) {
            imagesEl.textContent =
                `IMG→${data.image_requests.toLocaleString()}`;
        }        

        clearInterval(tickTimer);

        tickTimer = setInterval(tick, 50);

        dot.animate([
            { transform: 'scale(1)' },
            { transform: 'scale(1.6)' },
            { transform: 'scale(1)' }
        ], {
            duration: 250,
            easing: 'ease-out'
        });
    }

    function setOffline() {

        dot.className = 'offline';

        text.className = 'offline';
        text.textContent = 'Offline';

        cursor.style.display = 'none';

        clearInterval(tickTimer);

        tickTimer = null;
        serverUptimeMs = null;

        uptimeEl.textContent = '';
        requestsEl.textContent = '';
        latencyEl.textContent = '';
        memoryEl.textContent = '';
        if (imagesEl) {
            imagesEl.textContent = '';
        }        
    }

    async function checkStatus() {

        try {

            const res = await fetch(
                'https://terril.duckdns.org/api/status',
                {
                    cache: 'no-store',
                    signal: AbortSignal.timeout(5000)
                }
            );

            if (!res.ok) {
                throw new Error('non-2xx');
            }

            const data = await res.json();

            setOnline(data);

        }
        catch {

            setOffline();
        }
    }

    const GLITCH = {
        first:  [3000, 5000],     
        every:  [5000, 10000],    
        count:  [5, 10],          
        spread: [0, 700],         
        length: [250, 500],       
        step:   120,                // ms between glyph / look changes of one character
        looks:  { off: 3, outline: 4, bright: 8, block: 1 }
    };
    const GLITCH_IDS = ['status-text', 'status-uptime', 'status-requests', 'status-images', 'status-latency', 'status-memory'];
    const gR  = r => r[0] + Math.random() * (r[1] - r[0]);
    const gRI = r => Math.floor(r[0] + Math.random() * (r[1] - r[0] + 1));
    const gRnd = s => s[Math.floor(Math.random() * s.length)];
    const G_UP = 'ABCDEFGHJKLNOPQRSTUVXYZ', G_LO = 'abcdeghknopqsuvxyz', G_DG = '0123456789';
    const G_LIVE = /[A-Za-z0-9]/;
    let glitchRunning = false;

    function glitchGlyph(ch) {
        if (/[0-9]/.test(ch)) return gRnd(G_DG);
        if (!/[A-Za-z]/.test(ch)) return ch;
        return ch === ch.toUpperCase() ? gRnd(G_UP) : gRnd(G_LO);
    }

    function glitchLook() {
        const w = GLITCH.looks;
        let tot = 0, k;
        for (k in w) tot += w[k];
        let x = Math.random() * tot, last = 'bright';
        for (k in w) { last = k; x -= w[k]; if (x < 0) return k; }
        return last;
    }

    function glitchBurst() {
        if (glitchRunning || document.hidden) return;

        const live = [];
        GLITCH_IDS.forEach(id => {
            const el = document.getElementById(id);
            if (!el || el.children.length > 0 || !el.textContent.trim() || el.getBoundingClientRect().width <= 0) return;
            Array.from(el.textContent).forEach((ch, i) => { if (G_LIVE.test(ch)) live.push({ el, i }); });
        });
        const n = Math.min(live.length, gRI(GLITCH.count));
        if (n <= 0) return;

        const hit = live.sort(() => Math.random() - 0.5).slice(0, n);
        const originals = new Map();
        glitchRunning = true;
        try {
            new Set(hit.map(h => h.el)).forEach(el => {
                const text = el.textContent;
                originals.set(el, text);
                el.textContent = '';
                Array.from(text).forEach(ch => {
                    const sp = document.createElement('span');
                    sp.className = 'st-ch';
                    sp.textContent = ch;
                    el.appendChild(sp);
                });
            });

            const t0 = performance.now();
            let end = 0;
            hit.forEach(h => {
                h.sp = h.el.children[h.i];
                h.final = h.sp.textContent;
                h.gs = t0 + gR(GLITCH.spread);
                h.ge = h.gs + gR(GLITCH.length);
                h.nextAt = 0;
                h.done = false;
                end = Math.max(end, h.ge);
            });

            const finish = () => {
                originals.forEach((text, el) => { if (el.querySelector('.st-ch')) el.textContent = text; });
                glitchRunning = false;
            };

            const iv = setInterval(() => {
                const now = performance.now();
                hit.forEach(h => {
                    if (now >= h.gs && now < h.ge) {
                        if (now >= h.nextAt) {
                            h.sp.textContent = glitchGlyph(h.final);
                            h.sp.className = 'st-ch lk-' + glitchLook();
                            h.nextAt = now + GLITCH.step;
                        }
                    } else if (now >= h.ge && !h.done) {
                        h.sp.textContent = h.final;
                        h.sp.className = 'st-ch';
                        h.done = true;
                    }
                });
                if (now > end + 30) { clearInterval(iv); finish(); }
            }, 30);
        } catch (e) {
            originals.forEach((text, el) => { el.textContent = text; });
            glitchRunning = false;
        }
    }

    (function scheduleGlitch(first) {
        setTimeout(() => { glitchBurst(); scheduleGlitch(false); }, gR(first ? GLITCH.first : GLITCH.every));
    })(true);

    function updateClockIcon() {
        const clockIcon = document.getElementById('status-clock-icon');

        let hour = 1;

        setInterval(() => {

            clockIcon.className =
                `ti ti-clock-hour-${hour}`;

            hour++;

            if (hour > 12) {
                hour = 1;
            }

        }, 1000);      
    }

    checkStatus();
    updateClockIcon();

    setInterval(checkStatus, 30000);


})();

(function () {
    const btn  = document.getElementById('sfx-toggle');
    const icon = document.getElementById('sfx-toggle-icon');

    if (!btn || !icon || !window.SoundFX) return;

    function render() {
        const muted = SoundFX.isMuted();
        icon.className = muted ? 'ti ti-volume-off' : 'ti ti-volume';
        btn.classList.toggle('muted', muted);
        btn.title = muted ? 'Unmute sound effects' : 'Mute sound effects';
    }

    btn.addEventListener('click', () => {
        const next = !SoundFX.isMuted();
        SoundFX.setMuted(next);
        render();
        if (!next) SoundFX.play('generic_click');

        const path = `sfx-toggle/${next ? 'muted' : 'unmuted'}`;
        if (typeof logEvent === 'function') {
            logEvent(path);
        } else {
            new Image().src = `https://terril.duckdns.org/event/${path}`;
        }
    });

    document.addEventListener('sfx-mute-change', render);

    render();
})();
</script>

<script>
(function () {
    const btn = document.getElementById('lang-toggle');
    if (!btn) return;

    function render() {
        const ko = window.I18n && I18n.lang === 'ko';
        btn.classList.toggle('on', !!ko);
        btn.setAttribute('aria-pressed', ko ? 'true' : 'false');
    }

    btn.addEventListener('click', () => {
        if (!window.I18n) return;
        const lang = I18n.toggle();
        render();
        if (window.SoundFX && typeof SoundFX.play === 'function') { try { SoundFX.play('generic_click'); } catch (e) {} }
        const path = 'lang-toggle/' + lang;
        if (typeof logEvent === 'function') logEvent(path);
        else new Image().src = 'https://terril.duckdns.org/event/' + path;
    });

    document.addEventListener('lang-change', render);
    render();
})();
</script>

<script>
(function () {
    const AT = window.AccentTheme;
    const btn   = document.getElementById('accent-toggle');
    const panel = document.getElementById('accent-panel');
    if (!AT || !btn || !panel) return;

    const hue = document.getElementById('accent-hue');
    const sat = document.getElementById('accent-sat');
    const lit = document.getElementById('accent-lit');
    const presetsEl = document.getElementById('accent-presets');
    const resetBtn  = document.getElementById('accent-reset');
    const saveBtn   = document.getElementById('accent-save');
    const hintEl    = document.getElementById('accent-hint');

    const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));
    function log(what) {
        if (typeof logEvent === 'function') logEvent('accent/' + what);
    }

    const FIELDS = [
        { key: 'h', slider: hue, out: document.getElementById('accent-hue-val'), min: 0,   max: 359, fmt: v => v + '\u00b0' },
        { key: 's', slider: sat, out: document.getElementById('accent-sat-val'), min: 0,   max: 100, fmt: v => v + '%' },
        { key: 'l', slider: lit, out: document.getElementById('accent-lit-val'), min: -15, max: 15,  fmt: v => (v > 0 ? '+' : '') + v }
    ];

    function parseNum(str) {
        const m = String(str).replace(/\u2212/g, '-').match(/[-+]?\d+(?:\.\d+)?/);
        return m ? Number(m[0]) : NaN;
    }

    FIELDS.forEach(f => {
        const out = f.out;
        let fresh = false;  

        out.addEventListener('focus', () => { fresh = true; out.select(); });
        out.addEventListener('mouseup', e => { if (fresh) { e.preventDefault(); fresh = false; } });
        out.addEventListener('blur', () => { fresh = false; });

        out.addEventListener('change', () => {
            const n = parseNum(out.value);
            const cur = AT.get()[f.key];
            if (!Number.isFinite(n)) { out.value = f.fmt(cur); return; }  
            let v = Math.round(n);
            v = f.key === 'h' ? ((v % 360) + 360) % 360 : clamp(v, f.min, f.max);   
            out.value = f.fmt(v);
            if (v !== cur) { AT.set({ [f.key]: v }, true); log('type-' + f.key); }
        });

        out.addEventListener('keydown', e => {
            if (e.key === 'Enter') { e.preventDefault(); out.blur(); }
            else if (e.key === 'Escape') {
                e.stopPropagation(); 
                out.value = f.fmt(AT.get()[f.key]);
                out.blur();
            }
        });
    });

    const FACTORY = [
        { name: 'Gold',    stock: true },
        { name: 'Rose',    h: 345, s: 48, l: 0 },
        { name: 'Coral',   h: 12,  s: 62, l: 0 },
        { name: 'Lime',    h: 85,  s: 42, l: 0 },
        { name: 'Emerald', h: 145, s: 38, l: 0 },
        { name: 'Teal',    h: 178, s: 42, l: 0 },
        { name: 'Sky',     h: 205, s: 52, l: 0 },
        { name: 'Violet',  h: 268, s: 48, l: 0 }
    ];

    const STORE_KEY = 'accent-user-presets';

    function cleanPreset(v) {
        if (!v || typeof v !== 'object') return null;
        const h = Number(v.h), s = Number(v.s), l = Number(v.l);
        if (![h, s, l].every(Number.isFinite)) return null;
        return { h: clamp(Math.round(h), 0, 359), s: clamp(Math.round(s), 0, 100), l: clamp(Math.round(l), -15, 15) };
    }
    function loadUser() {
        try {
            const a = JSON.parse(localStorage.getItem(STORE_KEY));
            if (Array.isArray(a)) return FACTORY.map((p, i) => p.stock ? null : cleanPreset(a[i]));
        } catch (e) {}
        return FACTORY.map(() => null);
    }
    function saveUser() {
        try { localStorage.setItem(STORE_KEY, JSON.stringify(user)); } catch (e) {}
    }

    let user = loadUser();     
    let saving = false;
    let lpTimer = null;       
    let lpFired = false;      

    const atDefault = () => {
        if (AT.isDefault()) return true;
        const t = AT.get(), k = AT.STOCK;
        return t.h === k.h && t.s === k.s && t.l === k.l;
    };

    const slotOf = i => user[i] || FACTORY[i];
    const colorOf = p => p.stock ? '#c9b97a' : `hsl(${p.h} ${p.s}% ${63 + p.l}%)`;

    function restoreSlot(i) {
        if (!user[i]) return false;
        user[i] = null;
        saveUser();
        renderSwatch(i);
        sync();
        log('restore-slot-' + i);
        return true;
    }

    function renderSwatch(i) {
        const p = slotOf(i), sw = swatches[i], custom = !!user[i];
        sw.style.background = colorOf(p);
        sw.classList.toggle('custom', custom);
        sw.title = custom ? 'Your preset (right-click or long-press to restore)' : FACTORY[i].name;
        sw.setAttribute('aria-label', sw.title);
    }

    const swatches = FACTORY.map((p, i) => {
        const b = document.createElement('button');
        b.type = 'button';
        b.className = 'accent-swatch' + (p.stock ? ' stock' : '');
        presetsEl.appendChild(b);

        if (i === 0) {  
            const d = document.createElement('span');
            d.className = 'accent-divider';
            d.setAttribute('aria-hidden', 'true');
            presetsEl.appendChild(d);
        }

        b.addEventListener('click', e => {
            if (lpFired) { lpFired = false; e.preventDefault(); return; } 
            if (saving) {
                if (p.stock) return;
                const t = AT.get();
                user[i] = { h: t.h, s: t.s, l: t.l };
                saveUser();
                renderSwatch(i);
                setSaving(false);
                sync();
                log('save-slot-' + i);
                return;
            }
            const q = slotOf(i);
            if (q.stock) AT.reset(); else AT.set({ h: q.h, s: q.s, l: q.l });
            log('preset-' + (user[i] ? 'custom-' + i : p.name.toLowerCase()));
        });

        b.addEventListener('contextmenu', e => {
            if (!user[i] && !lpFired) return; 
            e.preventDefault();               
            restoreSlot(i);
        });

        let lpX = 0, lpY = 0;
        const lpCancel = () => { clearTimeout(lpTimer); lpTimer = null; };

        b.addEventListener('pointerdown', e => {
            lpFired = false;
            lpCancel();
            if (e.pointerType === 'mouse' || saving || !user[i]) return;
            lpX = e.clientX; lpY = e.clientY;
            lpTimer = setTimeout(() => {
                lpTimer = null;
                if (restoreSlot(i)) {
                    lpFired = true;
                    try { if (navigator.vibrate) navigator.vibrate(15); } catch (err) {}
                }
            }, 500);
        });
        b.addEventListener('pointermove', e => {
            if (lpTimer && Math.hypot(e.clientX - lpX, e.clientY - lpY) > 8) lpCancel();
        });
        ['pointerup', 'pointercancel', 'pointerleave'].forEach(t => b.addEventListener(t, lpCancel));
        return b;
    });
    swatches.forEach((_, i) => renderSwatch(i));

    function setSaving(on) {
        saving = on;
        presetsEl.classList.toggle('saving', on);
        saveBtn.classList.toggle('on', on);
        saveBtn.setAttribute('aria-pressed', String(on));
        hintEl.hidden = !on;
    }

    saveBtn.addEventListener('click', () => {
        if (atDefault()) return;
        setSaving(!saving);
        if (saving) log('save-mode');
    });

    /* ---------------- sync ---------------- */
    function sync() {
        const t = AT.get();
        const goldL = 63 + t.l;
        hue.value = t.h; sat.value = t.s; lit.value = t.l;
        FIELDS.forEach(f => { if (document.activeElement !== f.out) f.out.value = f.fmt(t[f.key]); });
        panel.style.setProperty('--ac-h', t.h);
        panel.style.setProperty('--ac-s', t.s + '%');
        panel.style.setProperty('--ac-l', goldL + '%');

        const def = atDefault();
        resetBtn.disabled = AT.isDefault(); 
        saveBtn.disabled = def;
        if (def && saving) setSaving(false);
        btn.classList.toggle('modified', !def);

        swatches.forEach((sw, i) => {
            const p = slotOf(i);
            const on = p.stock ? def
                : (!def && t.l === p.l && Math.abs(t.h - p.h) < 1 && Math.abs(t.s - p.s) < 1);
            sw.classList.toggle('active', on);
        });
    }

    [[hue, 'h'], [sat, 's'], [lit, 'l']].forEach(([el, key]) => {
        el.addEventListener('input',  () => AT.set({ [key]: Number(el.value) }, false));
        el.addEventListener('change', () => { AT.set({ [key]: Number(el.value) }, true); log('slider-' + key); });
    });

    document.getElementById('accent-random').addEventListener('click', () => { AT.random(); log('random'); });
    resetBtn.addEventListener('click', () => { AT.reset(); log('reset'); });
    document.addEventListener('accent-change', sync);
    window.addEventListener('storage', e => {
        if (e.key !== STORE_KEY) return;
        user = loadUser();
        swatches.forEach((_, i) => renderSwatch(i));
        sync();
    });

    function setOpen(open) {
        panel.classList.toggle('open', open);
        btn.setAttribute('aria-expanded', String(open));
        if (!open) setSaving(false);
        if (open) sync();
    }

    btn.addEventListener('click', () => {
        const open = !panel.classList.contains('open');
        setOpen(open);
        if (window.SoundFX && typeof SoundFX.play === 'function') { try { SoundFX.play('generic_click'); } catch (e) {} }
        if (open) log('open');
    });

    document.addEventListener('click', e => {
        if (!panel.classList.contains('open')) return;
        if (e.target.closest('.accent-wrap')) return;
        setOpen(false);
    });

    document.addEventListener('keydown', e => {
        if (e.key !== 'Escape' || !panel.classList.contains('open')) return;
        if (saving) { setSaving(false); return; }  
        setOpen(false); btn.focus();
    });

    sync();
})();
</script>
