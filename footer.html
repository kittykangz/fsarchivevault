function openFooterModal(key) {
	const entry = FOOTER_MODAL_CONTENT[key];
	if (!entry) return;
	document.getElementById("footer-modal-title").textContent = entry.title;
	document.getElementById("footer-modal-body").innerHTML = entry.body;
	document.getElementById("footer-modal").classList.remove("hidden");
}

function closeFooterModal() {
	document.getElementById("footer-modal").classList.add("hidden");
}

document.querySelectorAll(".site-footer-link").forEach(link => {

document.addEventListener("click", e => {

<style>

.egg-trigger {
  position: absolute;
  right: 12px;
  top: 50%;
  width: 5px;
  height: 5px;
  margin: 0;
  padding: 0;
  border: 1px solid var(--text-secondary);

  opacity: 0.25;
  transform: translateY(-50%);

  transition: opacity 0.4s ease, border-color 0.4s ease,

}

.egg-trigger::after {

  position: absolute;
  inset: -8px;
}

.egg-trigger:hover,
.egg-trigger:focus-visible {
  opacity: 1;
  border-color: var(--gold);
  background: var(--gold);
  outline: none;
}

/* Full-screen reading view */
.egg-overlay {
  position: fixed;
  inset: 0;
  /* Must beat the gallery's scroll-to-top (2147483000), lightbox and modal layers */
  z-index: 2147483600;
  display: flex;
  align-items: stretch;
  justify-content: center;
  background: var(--bg);
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
  transition: opacity 0.8s ease, visibility 0s linear 0.8s;
}

.egg-overlay.open {
  opacity: 1;
  visibility: visible;
  pointer-events: auto;
  transition: opacity 0.8s ease, visibility 0s;
}

.egg-close {
  position: absolute;
  top: 22px;

  border: none;
  background: transparent;
  color: #686257;
  font-size: 12px;
  cursor: pointer;
  opacity: 0.45;
  transition: opacity 0.25s ease, color 0.25s ease;
}

.egg-close:hover {

  opacity: 1;
}

/* Center the reading column, not the individual lines */
.egg-scroll {
  width: 100%;
  max-height: 100%;
  overflow-y: auto;
  box-sizing: border-box;
  padding: clamp(90px, 13vh, 150px) 28px 70px;
  display: flex;
  justify-content: center;
  scrollbar-width: thin;
  scrollbar-color: #38352f transparent;
  overscroll-behavior: contain;
}

  width: 100%;

  margin: 0 auto;
  align-self: flex-start;

  opacity: 0;
  animation: eggLineIn 1.5s ease forwards;
  animation-delay: 5s;
}

/* The input itself is deliberately left unstyled (browser default). */

.egg-content {

}

}

.egg-answer-status {

<div id="egg-overlay" class="egg-overlay" aria-hidden="true">
  <button id="egg-close" class="egg-close" type="button"
    aria-label="Close">✕</button>

  <div class="egg-scroll" id="egg-scroll">
    <div class="egg-content">
      <div class="egg-time" id="egg-time" hidden></div>

      <div class="egg-poem" id="egg-poem"></div>

      <form class="egg-answer-wrap" id="egg-answer-form"
        autocomplete="off" hidden>
        <input
          id="egg-answer"
          type="text"
          placeholder="..."
          aria-label="Answer"
          maxlength="200"
          spellcheck="false"
          autocapitalize="none"
          autocomplete="off"
        />
        <div id="egg-answer-status"
          class="egg-answer-status" aria-live="polite"></div>
      </form>
    </div>
  </div>
</div>


<script>
(function () {
	const EGG_API_BASE = "https://terril.duckdns.org";
	const EGG_ENDPOINT = "/api/window";
	const EGG_ANSWER_ENDPOINT = "/api/window/answer";

	const footer    = document.getElementById("site-footer");
	const overlay   = document.getElementById("egg-overlay");
	const poemEl    = document.getElementById("egg-poem");
	const scrollEl  = document.getElementById("egg-scroll");
	const contentEl = overlay ? overlay.querySelector(".egg-content") : null;
	const timeEl    = document.getElementById("egg-time");
	const form      = document.getElementById("egg-answer-form");
	const input     = document.getElementById("egg-answer");
	const statusEl  = document.getElementById("egg-answer-status");
	if (!footer || !overlay || !contentEl) return;

	function logEgg(name) {
		try {
			if (window.Log && Log.send && Log.ui) {
				Log.send(Log.ui.apply(null, [name].concat([].slice.call(arguments, 1))));
			}
		} catch (e) {}
	}

	const trigger = document.createElement("button");
	trigger.type = "button";
	trigger.className = "egg-trigger";
	trigger.setAttribute("aria-label", "A window");
	footer.appendChild(trigger);

	let busy = false;
	let submitting = false;
	let current = null;
	let statusTimer = null;

	function setStatus(msg, sticky) {
		clearTimeout(statusTimer);
		statusEl.textContent = msg || "";
		statusEl.classList.toggle("visible", !!msg);
		if (msg && !sticky) {
			statusTimer = setTimeout(() => statusEl.classList.remove("visible"), 2500);
		}
	}

	function render(stage) {
		current = stage;

		poemEl.textContent = "";
		const lines = (stage.text || "").replace(/\r\n/g, "\n").split("\n");
		lines.forEach((line, i) => {
			const div = document.createElement("div");
			div.className = "egg-line";
			div.textContent = line;
			div.style.animationDelay = Math.min(i * 90, 5500) + "ms";
			poemEl.appendChild(div);
		});

		timeEl.textContent = stage.time || "";
		timeEl.hidden = !stage.time;

		input.value = "";
		setStatus("");
		form.hidden = !stage.input;
		if (stage.input) {
			form.style.animation = "none";
			void form.offsetWidth;
			form.style.animation = "";
			form.style.animationDelay = (Math.min(lines.length * 90, 5500) + 1200) + "ms";
		}

		scrollEl.scrollTop = 0;
	}

	async function openEgg() {
		if (busy || overlay.classList.contains("open")) return;
		busy = true;
		try {
			if (!current) {
				const res = await fetch(EGG_API_BASE + EGG_ENDPOINT, { cache: "no-store" });
				if (!res.ok) return;
				const data = await res.json();
				if (!data || !(data.text || "").trim()) return;
				current = data;
			}
			render(current);
			overlay.classList.add("open");
			overlay.setAttribute("aria-hidden", "false");
			document.body.style.overflow = "hidden";
			logEgg("egg-open", current.stage);
		} catch (e) {
		} finally {
			busy = false;
		}
	}

	function closeEgg(how) {
		if (!overlay.classList.contains("open")) return;
		logEgg("egg-close", how || "other", current ? current.stage : "-");
		overlay.classList.remove("open");
		overlay.setAttribute("aria-hidden", "true");
		document.body.style.overflow = "";
		setTimeout(() => {
			if (!overlay.classList.contains("open")) {
				poemEl.textContent = "";
				input.value = "";
				setStatus("");
			}
		}, 900);
	}

	form.addEventListener("submit", async e => {
		e.preventDefault();
		if (submitting || !current) return;
		const answer = input.value;
		if (!answer.trim()) return;
		const stage = current.stage;

		submitting = true;
		try {
			const res = await fetch(EGG_API_BASE + EGG_ANSWER_ENDPOINT, {
				method: "POST",
				headers: { "Content-Type": "application/json" },
				body: JSON.stringify({ stage, answer })
			});
			if (res.status === 429) { logEgg("egg-guess", stage, answer, "ratelimited"); setStatus("slow down"); return; }
			if (!res.ok) { logEgg("egg-guess", stage, answer, "error"); setStatus("..."); return; }

			const data = await res.json();
			if (!data.correct) {
				logEgg("egg-guess", stage, answer, "wrong");
				input.value = "";
				setStatus(""); // incorrect answer
				return;
			}
			logEgg("egg-guess", stage, answer, "correct");
			if (!data.next) {
				setStatus("correct", true);
				return;
			}
			contentEl.classList.add("swap");
			await new Promise(r => setTimeout(r, 650));
			render(data.next);
			contentEl.classList.remove("swap");
		} catch (err) {
			logEgg("egg-guess", stage, answer, "error");
			setStatus("...");
		} finally {
			submitting = false;
		}
	});

	trigger.addEventListener("click", openEgg);
	document.getElementById("egg-close").addEventListener("click", () => closeEgg("x"));

	overlay.addEventListener("click", e => {
		if (e.target === overlay || e.target === scrollEl) closeEgg("backdrop");
	});

	overlay.addEventListener("wheel", e => e.stopPropagation(), { passive: true });

	document.addEventListener("keydown", e => {
		if (e.key === "Escape" && overlay.classList.contains("open")) closeEgg("esc");
	});
})();
</script>
