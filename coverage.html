<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Coverage — Fansite Archive Vault</title>
<style>
  :root {
    --bg: #111010;
    --bg-surf: #1a1917;
    --bg-deep: #0d0c0b;
    --gold: #c9b97a;
    --gold-dim: rgba(201, 185, 122, 0.35);
    --text: #e8e6df;
    --text-dim: #8a877c;
    --border: rgba(201, 185, 122, 0.14);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "DM Sans", -apple-system, sans-serif;
    padding: 40px 32px 80px;
  }

  h1 { font-size: 20px; font-weight: 600; letter-spacing: 0.02em; margin: 0 0 4px; }

  .meta {
    font-family: "DM Mono", monospace;
    font-size: 12px;
    color: var(--text-dim);
    margin-bottom: 28px;
  }

  .meta button {
    background: none;
    border: 1px solid var(--border);
    color: var(--gold);
    font-family: "DM Mono", monospace;
    font-size: 11px;
    padding: 4px 10px;
    cursor: pointer;
    margin-left: 10px;
  }
  .meta button:hover { border-color: var(--gold); }
  .meta button:disabled { opacity: 0.4; cursor: default; }

  .progress-line {
    font-family: "DM Mono", monospace;
    font-size: 11px;
    color: var(--gold);
    margin-bottom: 10px;
    min-height: 14px;
  }

  .overall {
    background: var(--bg-surf);
    border: 1px solid var(--border);
    padding: 20px 24px;
    margin-bottom: 32px;
  }

  .overall-top { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 10px; }
  .overall-pct { font-family: "DM Mono", monospace; font-size: 28px; color: var(--gold); }
  .overall-frac { font-family: "DM Mono", monospace; font-size: 12px; color: var(--text-dim); }

  .bar-track { height: 6px; background: var(--bg-deep); border: 1px solid var(--border); }
  .bar-fill { height: 100%; background: var(--gold); transition: width 0.2s; }

  .controls { display: flex; gap: 8px; margin-bottom: 14px; font-family: "DM Mono", monospace; font-size: 11px; }
  .controls button { background: var(--bg-surf); border: 1px solid var(--border); color: var(--text-dim); padding: 5px 12px; cursor: pointer; }
  .controls button.active { color: var(--gold); border-color: var(--gold-dim); }

  .group-block { margin-bottom: 26px; }

  .group-header {
    display: flex; justify-content: space-between;
    font-size: 13px; font-weight: 600; letter-spacing: 0.03em; text-transform: uppercase;
    color: var(--text);
    border-bottom: 1px solid var(--border);
    padding-bottom: 6px; margin-bottom: 8px;
  }
  .group-header .group-pct { font-family: "DM Mono", monospace; color: var(--gold); text-transform: none; font-weight: 400; font-size: 12px; }

  .member-row {
    display: grid;
    grid-template-columns: 160px 1fr 90px;
    align-items: center;
    gap: 14px;
    padding: 5px 0;
    font-size: 13px;
  }
  .member-name { color: var(--text); }
  .member-bar-track { height: 4px; background: var(--bg-surf); border: 1px solid var(--border); }
  .member-bar-fill { height: 100%; background: var(--gold); }
  .member-frac { font-family: "DM Mono", monospace; font-size: 11px; color: var(--text-dim); text-align: right; }

  .empty { color: var(--text-dim); font-family: "DM Mono", monospace; font-size: 12px; }
  .err { color: #c98a7a; }
</style>
</head>
<body>

  <h1>Archive Coverage</h1>
  <div class="meta">
    <span id="status-text">loading roster…</span>
    <button id="refresh-btn">refresh</button>
  </div>
  <div class="progress-line" id="progress-line"></div>

  <div class="overall">
    <div class="overall-top">
      <div class="overall-pct" id="overall-pct">—</div>
      <div class="overall-frac" id="overall-frac">—</div>
    </div>
    <div class="bar-track"><div class="bar-fill" id="overall-bar" style="width:0%"></div></div>
  </div>

  <div class="controls">
    <button id="sort-alpha" class="active">A–Z</button>
    <button id="sort-worst">worst first</button>
    <button id="sort-best">best first</button>
  </div>

  <div id="groups"></div>

  <script>
    // ---- config -----------------------------------------------------
    // Leave blank if this page is served from the same origin as your
    // Flask API. Set to your tunnel/production origin if this page is
    // opened from somewhere else (e.g. "https://terril.duckdns.org").
    const API_BASE = "https://terril.duckdns.org";
    const COVERAGE_ENDPOINT = API_BASE + "/api/tweet-coverage";
    const ROSTER_PATH = "./roster.json"; // generated by generate_roster.py

    const CONCURRENCY = 8; // how many /api/tweet-coverage calls in flight at once
    // -------------------------------------------------------------------

    let sortMode = "alpha";
    let lastResults = null;

    async function fetchMemberCoverage(entry) {
      const url = `${COVERAGE_ENDPOINT}?member=${encodeURIComponent(entry.member_key)}`;
      try {
        const res = await fetch(url);
        if (!res.ok) {
          return { ...entry, covered: 0, total: 0, percent: 0, error: `HTTP ${res.status}` };
        }
        const data = await res.json();
        if (data.error) {
          return { ...entry, covered: 0, total: 0, percent: 0, error: data.error };
        }
        // data.covered is now {filename: tier} rather than a flat array --
        // count keys instead of .length. Handles either shape defensively
        // in case this ever runs against a stale/mixed deploy.
        const covered = Array.isArray(data.covered)
          ? data.covered.length
          : (data.covered && typeof data.covered === "object" ? Object.keys(data.covered).length : 0);
        const total = data.total || 0;
        const percent = total ? Math.round((covered / total) * 1000) / 10 : 0;
        return { ...entry, covered, total, percent };
      } catch (e) {
        return { ...entry, covered: 0, total: 0, percent: 0, error: String(e) };
      }
    }

    async function runPool(items, worker, concurrency, onProgress) {
      const results = new Array(items.length);
      let next = 0;
      let done = 0;

      async function runner() {
        while (next < items.length) {
          const i = next++;
          results[i] = await worker(items[i]);
          done++;
          onProgress(done, items.length);
        }
      }

      const runners = Array.from({ length: Math.min(concurrency, items.length) }, runner);
      await Promise.all(runners);
      return results;
    }

    async function loadAll() {
      const btn = document.getElementById("refresh-btn");
      const statusText = document.getElementById("status-text");
      const progressLine = document.getElementById("progress-line");
      btn.disabled = true;

      statusText.textContent = "loading roster…";
      progressLine.textContent = "";

      let roster;
      try {
        const res = await fetch(ROSTER_PATH);
        roster = await res.json();
      } catch (e) {
        statusText.textContent = "";
        progressLine.innerHTML = `<span class="err">Failed to load ${ROSTER_PATH}: ${e}. Run generate_roster.py and make sure roster.json sits next to this HTML file.</span>`;
        btn.disabled = false;
        return;
      }

      statusText.textContent = `querying ${roster.length} members…`;

      const results = await runPool(roster, fetchMemberCoverage, CONCURRENCY, (done, total) => {
        progressLine.textContent = `${done} / ${total} members checked`;
      });

      lastResults = results;
      statusText.textContent = "done";
      progressLine.textContent = "";
      render(results);
      btn.disabled = false;
    }

    function render(results) {
      const errors = results.filter(r => r.error);
      let totalCovered = 0, totalFiles = 0;
      for (const r of results) { totalCovered += r.covered; totalFiles += r.total; }
      const overallPct = totalFiles ? Math.round((totalCovered / totalFiles) * 1000) / 10 : 0;

      document.getElementById("overall-pct").textContent = overallPct + "%";
      document.getElementById("overall-frac").textContent =
        `${totalCovered.toLocaleString()} / ${totalFiles.toLocaleString()} files` +
        (errors.length ? `  (${errors.length} members failed to load)` : "");
      document.getElementById("overall-bar").style.width = overallPct + "%";

      const groupsMap = {};
      for (const r of results) {
        if (!groupsMap[r.group]) groupsMap[r.group] = [];
        groupsMap[r.group].push(r);
      }

      let groupEntries = Object.entries(groupsMap).map(([group, members]) => {
        const covered = members.reduce((a, m) => a + m.covered, 0);
        const total = members.reduce((a, m) => a + m.total, 0);
        const pct = total ? Math.round((covered / total) * 1000) / 10 : 0;
        return { group, members, covered, total, pct };
      });

      if (sortMode === "alpha") groupEntries.sort((a, b) => a.group.localeCompare(b.group));
      else if (sortMode === "worst") groupEntries.sort((a, b) => a.pct - b.pct);
      else if (sortMode === "best") groupEntries.sort((a, b) => b.pct - a.pct);

      const container = document.getElementById("groups");
      container.innerHTML = "";

      if (groupEntries.length === 0) {
        container.innerHTML = `<div class="empty">No members found.</div>`;
        return;
      }

      for (const g of groupEntries) {
        let members = [...g.members];
        if (sortMode === "alpha") members.sort((a, b) => a.member.localeCompare(b.member));
        else if (sortMode === "worst") members.sort((a, b) => a.percent - b.percent);
        else if (sortMode === "best") members.sort((a, b) => b.percent - a.percent);

        const block = document.createElement("div");
        block.className = "group-block";

        const header = document.createElement("div");
        header.className = "group-header";
        header.innerHTML = `<span>${g.group}</span><span class="group-pct">${g.pct}% (${g.covered.toLocaleString()}/${g.total.toLocaleString()})</span>`;
        block.appendChild(header);

        for (const m of members) {
          const row = document.createElement("div");
          row.className = "member-row";
          if (m.error) {
            row.innerHTML = `
              <div class="member-name">${m.member || m.member_key}</div>
              <div class="err">failed: ${m.error}</div>
              <div class="member-frac"></div>
            `;
          } else {
            row.innerHTML = `
              <div class="member-name">${m.member || m.member_key}</div>
              <div class="member-bar-track"><div class="member-bar-fill" style="width:${m.percent}%"></div></div>
              <div class="member-frac">${m.percent}% · ${m.covered}/${m.total}</div>
            `;
          }
          block.appendChild(row);
        }

        container.appendChild(block);
      }
    }

    document.getElementById("refresh-btn").addEventListener("click", loadAll);
    document.getElementById("sort-alpha").addEventListener("click", () => setSort("alpha"));
    document.getElementById("sort-worst").addEventListener("click", () => setSort("worst"));
    document.getElementById("sort-best").addEventListener("click", () => setSort("best"));

    function setSort(mode) {
      sortMode = mode;
      document.querySelectorAll(".controls button").forEach(b => b.classList.remove("active"));
      document.getElementById(`sort-${mode}`).classList.add("active");
      if (lastResults) render(lastResults);
    }

    loadAll();
  </script>
</body>
</html>
